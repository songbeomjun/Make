<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#75b5df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VoxelCraft Standalone v3</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75b5df;touch-action:none;overscroll-behavior:none;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
#game{position:fixed;inset:0;background:#75b5df}
#canvas{display:none;width:100%;height:100%;touch-action:none}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(18px + var(--st)) calc(18px + var(--sr)) calc(18px + var(--sb)) calc(18px + var(--sl));background:linear-gradient(to bottom,#72b5df 0 57%,#8cc9e5 57% 62%,#6f983f 62% 66%,#76523a 66% 77%,#626262 77% 100%)}
#start:before{content:"";position:absolute;left:7%;bottom:24%;width:19%;height:18%;background:#39732f;box-shadow:30px -30px #39732f,60px -15px #45853a,100px 10px #5a8e42;clip-path:polygon(0 45%,20% 45%,20% 25%,40% 25%,40% 0,60% 0,60% 25%,80% 25%,80% 45%,100% 45%,100% 100%,0 100%);opacity:.95}
#start:after{content:"";position:absolute;right:9%;top:12%;width:68px;height:68px;background:#fff1a8;box-shadow:0 0 25px rgba(255,244,180,.22)}
.panel{position:relative;width:min(690px,95vw);background:rgba(198,198,198,.96);color:#202020;border:4px solid #171717;box-shadow:inset 3px 3px #fff,inset -3px -3px #666,0 12px 35px rgba(0,0,0,.35);padding:18px;text-align:center}
.logo{font-size:clamp(36px,8vw,74px);font-weight:900;letter-spacing:-4px;color:#eee;text-shadow:0 4px #555,4px 0 #555,-3px 0 #fff,0 -3px #fff,7px 7px #222;margin:3px 0 6px}
.version{font-size:12px;margin-bottom:14px;color:#333}
.okline{display:inline-block;padding:4px 8px;margin-bottom:8px;background:#315e2d;color:#fff;border:1px solid #173c15;font-size:12px}
.seed{display:flex;gap:8px;margin:10px 0}
.seed input{flex:1;height:42px;background:#202020;color:#fff;border:2px solid #111;padding:0 10px;user-select:text;-webkit-user-select:text}
.btn{width:100%;height:48px;margin:6px 0;background:#777;color:#fff;border:3px solid #111;font-weight:800;box-shadow:inset 3px 3px #aaa,inset -3px -3px #444;text-shadow:1px 1px #222}
.btn:active{box-shadow:inset 3px 3px #444,inset -3px -3px #aaa}
.small{font-size:12px;line-height:1.5;color:#333}
#loading{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;flex-direction:column;background:#1c2732;color:#fff;text-shadow:2px 2px #111}
#loading h2{margin:0 0 14px}
#track{width:min(460px,78vw);height:18px;background:#151515;border:3px solid #050505;box-shadow:inset 2px 2px #444}
#fill{height:100%;width:0;background:linear-gradient(#73c846,#498f2e)}
#loadText{margin-top:10px;font-size:13px}
#error{display:none;position:fixed;inset:0;z-index:100;background:#111820;color:#fff;align-items:center;justify-content:center;padding:20px}
#error .box{width:min(720px,95vw);background:#242c34;border:2px solid #68727d;padding:20px}
#error h2{margin-top:0;color:#ffb4aa}
#error pre{white-space:pre-wrap;word-break:break-word;background:#0e1216;padding:12px;border:1px solid #404952;max-height:45vh;overflow:auto}
#hud{display:none;position:fixed;inset:0;z-index:10;color:#fff;text-shadow:2px 2px #111;font-weight:800;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:1px 1px #111}
#cross:before{width:2px;height:20px;left:9px}#cross:after{height:2px;width:20px;top:9px}
#debug{position:absolute;left:calc(10px + var(--sl));top:calc(9px + var(--st));font-size:11px;line-height:1.4;background:rgba(0,0,0,.34);padding:6px 8px;border-radius:2px}
#bars{position:absolute;left:50%;bottom:calc(76px + var(--sb));transform:translateX(-50%);width:min(450px,92vw);display:flex;justify-content:space-between;font-size:17px}
#hotbar{position:absolute;left:50%;bottom:calc(15px + var(--sb));transform:translateX(-50%);display:flex;gap:3px;padding:3px;background:rgba(20,20,20,.75);border:2px solid #777;pointer-events:auto}
.slot{width:48px;height:48px;background:#595959;border:2px solid #777;box-shadow:inset 2px 2px rgba(255,255,255,.15),inset -2px -2px rgba(0,0,0,.45);position:relative;display:flex;align-items:center;justify-content:center}
.slot.sel{border:4px solid #fff;transform:translateY(-3px);box-shadow:0 0 0 2px #111}
.sw{width:31px;height:31px;background-repeat:no-repeat;image-rendering:pixelated;box-shadow:inset -3px -3px rgba(0,0,0,.17)}
.key{position:absolute;right:2px;bottom:0;font-size:10px}
#name{position:absolute;left:50%;bottom:calc(132px + var(--sb));transform:translateX(-50%);background:rgba(0,0,0,.45);padding:4px 7px;font-size:12px}
#breakbar{display:none;position:absolute;left:50%;top:calc(50% + 28px);transform:translateX(-50%);width:110px;height:9px;background:rgba(0,0,0,.65);border:1px solid #ddd}
#breakfill{height:100%;width:0;background:#eee}
#toast{position:absolute;left:50%;top:23%;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:7px 11px;opacity:0;transition:.15s}
#menu{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px}
#menu .panel{width:min(520px,94vw)}
#mobile{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}
#moveZone{position:absolute;left:0;bottom:0;width:48%;height:48%;pointer-events:auto}
#lookZone{position:absolute;right:0;top:0;width:56%;height:80%;pointer-events:auto}
#stick{display:none;position:absolute;width:124px;height:124px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.24);border:2px solid rgba(255,255,255,.28)}
#knob{position:absolute;width:58px;height:58px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.5)}
.mbtn{pointer-events:auto;position:absolute;width:64px;height:64px;border:2px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(20,20,20,.5);color:#fff;font-weight:800;text-shadow:1px 1px #000}
#jump{right:calc(16px + var(--sr));bottom:calc(140px + var(--sb))}
#mine{right:calc(90px + var(--sr));bottom:calc(70px + var(--sb))}
#place{right:calc(16px + var(--sr));bottom:calc(70px + var(--sb))}
#pause{right:calc(14px + var(--sr));top:calc(62px + var(--st));width:42px;height:42px;font-size:20px}
@media(pointer:coarse),(max-width:900px){
 #mobile{display:block}#debug{font-size:10px}
 #hotbar{left:34%;transform:translateX(-34%);max-width:67vw;overflow-x:auto;bottom:calc(8px + var(--sb))}
 .slot{min-width:41px;width:41px;height:41px}.sw{width:26px;height:26px}
 #bars{left:34%;transform:translateX(-34%);width:62vw;bottom:calc(55px + var(--sb));font-size:14px}
 #name{display:none}
}
</style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas></div>

<div id="start">
 <div class="panel">
  <div class="logo">VOXELCRAFT</div>
  <div class="version">STANDALONE v3 · CDN 없음 · 자체 WebGL 엔진</div>
  <div class="okline">HTML 정상 로드됨</div>
  <div class="seed"><input id="seed" value="KOREA-2026" maxlength="32"></div>
  <button class="btn" id="play">새 월드 플레이</button>
  <button class="btn" id="continue">저장 월드 이어하기</button>
  <div class="small">이 화면이 보이면 GitHub Pages 배포 자체는 정상입니다.<br>3D 엔진은 플레이 버튼을 누른 뒤에만 초기화됩니다.</div>
 </div>
</div>

<div id="loading"><h2>월드 생성 중</h2><div id="track"><div id="fill"></div></div><div id="loadText">준비 중…</div></div>
<div id="error"><div class="box"><h2>VoxelCraft 실행 오류</h2><p>검은 화면 대신 실제 원인을 표시합니다.</p><pre id="errMsg"></pre><button class="btn" onclick="location.reload()">다시 불러오기</button></div></div>

<div id="hud">
 <div id="cross"></div><div id="debug">대기 중</div>
 <div id="bars"><div id="hp">♥♥♥♥♥♥♥♥♥♥</div><div id="food">◆◆◆◆◆◆◆◆◆◆</div></div>
 <div id="hotbar"></div><div id="name"></div><div id="breakbar"><div id="breakfill"></div></div><div id="toast"></div>
</div>

<div id="menu"><div class="panel"><h2>게임 메뉴</h2><button class="btn" id="resume">게임으로 돌아가기</button><button class="btn" id="save">월드 저장</button><button class="btn" id="reset">월드 초기화</button></div></div>

<div id="mobile">
 <div id="moveZone"><div id="stick"><div id="knob"></div></div></div>
 <div id="lookZone"></div>
 <button class="mbtn" id="jump">점프</button><button class="mbtn" id="mine">채굴</button><button class="mbtn" id="place">설치</button><button class="mbtn" id="pause">Ⅱ</button>
</div>

addEventListener("keyup",e=>keys[e.code]=false);
canvas.addEventListener("click",()=>{if(!IS_TOUCH&&started&&!paused&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});
document.addEventListener("mousemove",e=>{if(document.pointerLockElement===canvas&&!paused){player.yaw-=e.movementX*.0023;player.pitch=Math.max(-1.53,Math.min(1.53,player.pitch-e.movementY*.0021))}});
canvas.addEventListener("mousedown",e=>{if(paused||IS_TOUCH||document.pointerLockElement!==canvas)return;if(e.button===0)startBreak();else if(e.button===2)placeBlock()});
canvas.addEventListener("mouseup",e=>{if(e.button===0)stopBreak()});canvas.addEventListener("wheel",e=>{slot=(slot+(e.deltaY>0?1:-1)+9)%9;updateHot()},{passive:true});
addEventListener("beforeunload",saveWorld);addEventListener("resize",resize);

const mz=$("#moveZone"),stick=$("#stick"),knob=$("#knob"),lz=$("#lookZone");
mz.addEventListener("touchstart",e=>{const t=e.changedTouches[0],r=mz.getBoundingClientRect();joy={id:t.identifier,cx:t.clientX,cy:t.clientY,x:0,y:0};stick.style.display="block";stick.style.left=(t.clientX-r.left)+"px";stick.style.top=(t.clientY-r.top)+"px";e.preventDefault()},{passive:false});
mz.addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===joy.id){let dx=t.clientX-joy.cx,dy=t.clientY-joy.cy,l=Math.hypot(dx,dy),m=48;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}e.preventDefault()},{passive:false});
function joyEnd(e){for(const t of e.changedTouches)if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0;stick.style.display="none";knob.style.transform="translate(-50%,-50%)"}e.preventDefault()}
mz.addEventListener("touchend",joyEnd,{passive:false});mz.addEventListener("touchcancel",joyEnd,{passive:false});
lz.addEventListener("touchstart",e=>{const t=e.changedTouches[0];look={id:t.identifier,x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});
lz.addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===look.id){player.yaw-=(t.clientX-look.x)*.0045;player.pitch=Math.max(-1.53,Math.min(1.53,player.pitch-(t.clientY-look.y)*.0042));look.x=t.clientX;look.y=t.clientY}e.preventDefault()},{passive:false});
lz.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===look.id)look.id=null;e.preventDefault()},{passive:false});
function press(id,down,up){const e=$(id);e.addEventListener("touchstart",x=>{down();x.preventDefault();x.stopPropagation()},{passive:false});e.addEventListener("touchend",x=>{if(up)up();x.preventDefault();x.stopPropagation()},{passive:false})}
press("#jump",()=>keys.Space=true,()=>keys.Space=false);press("#mine",startBreak,stopBreak);press("#place",placeBlock);

updateHot();requestAnimationFrame(loop);
</script>
</body>
</html>
